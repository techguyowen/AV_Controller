<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Broadcast Signal Waves -->
  <path d="M128 352 C96 304, 96 208, 128 160" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
  <path d="M384 352 C416 304, 416 208, 384 160" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
  
  <path d="M176 312 C160 280, 160 232, 176 200" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round"/>
  <path d="M336 312 C352 280, 352 232, 336 200" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round"/>

  <!-- Center Sanctuary Broadcast Tower / Cross Icon -->
  <g filter="url(#shadow)">
    <!-- Vertical Mast -->
    <rect x="242" y="100" width="28" height="312" rx="14" fill="url(#glow)"/>
    <!-- Cross Beam -->
    <rect x="180" y="176" width="152" height="28" rx="14" fill="url(#glow)"/>
    <!-- Beacon Dot -->
    <circle cx="256" cy="100" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
