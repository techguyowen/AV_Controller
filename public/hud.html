<!DOCTYPE html>
<html lang="en" class="h-full bg-[#090D13]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanctuary AV — Mini-HUD (Mixing Station Companion)</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="theme-color" content="#090D13">
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0a0d13;
            color: #cbd5e1;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-variant-numeric: tabular-nums slashed-zero;
        }

        /* Tally Status LEDs */
        .tally-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.25s ease;
        }
        .tally-green {
            background-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }
        .tally-red {
            background-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            animation: livePulse 1.8s infinite ease-in-out;
        }
        .tally-amber {
            background-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
        }
        .tally-off {
            background-color: #334155;
            box-shadow: none;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(0.92); }
        }

        /* Silence Alarm Flash */
        @keyframes silencePulse {
            0%, 100% { background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
            50% { background-color: rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.9); color: #ffffff; }
        }
        .silence-flashing {
            animation: silencePulse 0.8s infinite;
        }

        /* Mini Horizontal VU Meter */
        .mini-vu-track {
            height: 8px;
            background: #07090e;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #1e293b;
            position: relative;
        }
        .mini-vu-fill {
            height: 100%;
            background: linear-gradient(to right, #10b981 0%, #10b981 68%, #f59e0b 68%, #f59e0b 88%, #ef4444 88%, #ef4444 100%);
            transition: width 80ms ease-out;
            width: 0%;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-center p-2 sm:p-3 select-none">

    <!-- Container that adapts from compact horizontal bar to iPad vertical card -->
    <div class="bg-[#101520] border border-white/[0.08] rounded-xl p-3 sm:p-3.5 shadow-2xl flex flex-col gap-2.5 max-w-4xl mx-auto w-full">
        
        <!-- Top Bar / Main Line -->
        <div class="flex flex-wrap items-center justify-between gap-2 sm:gap-4">
            
            <!-- Left: Tally & Facility Branding -->
            <div class="flex items-center gap-2.5">
                <img src="/favicon.svg" alt="Logo" class="w-6 h-6 rounded shrink-0 border border-emerald-500/30">
                <div id="tally-pill" class="px-2.5 py-1 rounded bg-[#101722] border border-[#243242] text-xs font-bold font-mono text-slate-400 flex items-center gap-1.5 transition-colors">
                    <div id="tally-led" class="tally-led tally-off"></div>
                    <span id="tally-text">OFFLINE</span>
                </div>
                <div id="duration-text" class="text-sm font-bold font-mono text-white tracking-tight">00:00:00</div>
            </div>

            <!-- Silence Flash Warning (Hidden by default) -->
            <div id="silence-alarm-hud" class="hidden px-2.5 py-0.5 rounded border text-[11px] font-bold uppercase tracking-wider silence-flashing">
                🚨 Silence (>2 min)
            </div>

            <!-- Right: Health Badges & Controls -->
            <div class="flex items-center gap-2 sm:gap-3 text-xs font-mono">
                <!-- Bitrate -->
                <div class="bg-black/40 px-2.5 py-1 rounded border border-[#243242] flex items-center gap-1.5">
                    <span class="text-slate-500 text-[10px]">BITRATE</span>
                    <span id="bitrate-text" class="text-white font-bold">0 kbps</span>
                </div>

                <!-- YouTube Stream & Audio -->
                <div class="bg-black/40 px-2.5 py-1 rounded border border-[#243242] flex items-center gap-1.5">
                    <div id="yt-dot" class="tally-led tally-off"></div>
                    <span id="yt-audio-status" class="text-slate-400 font-semibold">YT STANDBY</span>
                </div>

                <!-- OBS Scene & Proclaim -->
                <div class="bg-black/40 px-2.5 py-1 rounded border border-[#243242] flex items-center gap-1.5 truncate max-w-32 hidden sm:flex">
                    <span class="text-blue-400 text-[10px]">SCENE:</span>
                    <span id="obs-scene-text" class="text-white font-bold truncate">---</span>
                </div>

                <!-- Viewers -->
                <div class="bg-black/40 px-2.5 py-1 rounded border border-[#243242] flex items-center gap-1">
                    <span class="text-slate-500 text-[10px]">👥</span>
                    <span id="viewers-count" class="text-white font-bold">0</span>
                </div>

                <!-- Quick Camera Switching Controls (2-Camera Setup) -->
                <div class="flex items-center gap-1 font-mono text-[10px]">
                    <button id="hud-cam1" onclick="HUD.setCam(1)" class="px-2 py-1 rounded bg-[#182230] hover:bg-slate-700 text-slate-300 font-bold border border-[#243242] cursor-pointer" title="Switch Program to Camera 1 (Pulpit)">
                        CAM 1
                    </button>
                    <button id="hud-cam2" onclick="HUD.setCam(2)" class="px-2 py-1 rounded bg-[#182230] hover:bg-slate-700 text-slate-300 font-bold border border-[#243242] cursor-pointer" title="Switch Program to Camera 2 (Wide)">
                        CAM 2
                    </button>
                    <button onclick="HUD.atemCut()" class="px-2 py-1 rounded bg-slate-700 hover:bg-white hover:text-black text-white font-bold border border-slate-600 cursor-pointer" title="Execute Hard Cut">
                        CUT
                    </button>
                </div>

                <!-- Emergency Screen Restore Button -->
                <button id="btn-hud-reopen" onclick="HUD.triggerReopenScreen()" class="px-2.5 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/50 text-[11px] font-bold transition-all flex items-center gap-1 shrink-0 active:scale-95 cursor-pointer" title="Forcefully restore fullscreen preview to LONTIUM screen (Monitor 1) & captions">
                    <span>📺 Reopen Screen</span>
                </button>

                <!-- Emergency Panic Button -->
                <button id="btn-hud-panic" onclick="HUD.triggerPanic()" class="px-2.5 py-1 rounded bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/50 text-[11px] font-bold transition-all flex items-center gap-1 shrink-0 active:scale-95 cursor-pointer" title="Emergency Panic: Instantly blank captions and mute output">
                    <span>🚨 Panic</span>
                </button>

                <!-- Full Dashboard Link -->
                <a href="/" target="_blank" title="Open Full Dashboard" class="p-1.5 rounded-lg bg-[#182230] hover:bg-slate-700 text-[#7BAFD4] border border-[#243242] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>

        </div>

        <!-- Master Audio Meter Bar (Soundcraft Si / REAPER Livestream Bus) -->
        <div class="bg-black/40 p-2 rounded-lg border border-[#243242]/80 flex items-center gap-3 text-xs font-mono">
            <span class="text-[10px] font-bold text-slate-400 shrink-0 uppercase tracking-wider">Si / REAPER Master:</span>
            
            <div class="flex-grow flex flex-col gap-1">
                <div class="mini-vu-track">
                    <div id="mini-vu-fill" class="mini-vu-fill"></div>
                </div>
            </div>

            <div class="shrink-0 text-right min-w-16">
                <span id="audio-db-text" class="text-slate-300 font-bold">-inf</span>
                <span class="text-[10px] text-slate-500">dBFS</span>
            </div>
        </div>

    </div>

<script>
/**
 * Mini-HUD Client Engine
 * Connects directly to Sanctuary AV WebSocket for instant real-time telemetry
 */
const HUD = {
    ws: null,
    dom: {},

    init() {
        this.dom = {
            tallyPill: document.getElementById('tally-pill'),
            tallyLed: document.getElementById('tally-led'),
            tallyText: document.getElementById('tally-text'),
            durationText: document.getElementById('duration-text'),
            silenceAlarm: document.getElementById('silence-alarm-hud'),
            bitrateText: document.getElementById('bitrate-text'),
            ytDot: document.getElementById('yt-dot'),
            ytAudioStatus: document.getElementById('yt-audio-status'),
            obsSceneText: document.getElementById('obs-scene-text'),
            viewersCount: document.getElementById('viewers-count'),
            miniVuFill: document.getElementById('mini-vu-fill'),
            audioDbText: document.getElementById('audio-db-text'),
        };

        this.connect();
    },

    connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}`;

        this.ws = new WebSocket(wsUrl);

        this.ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'STATE_UPDATE') {
                    this.applyState(msg.data);
                }
            } catch (e) {
                console.warn('[HUD WS] Error:', e);
            }
        };

        this.ws.onclose = () => {
            setTimeout(() => this.connect(), 2000);
        };
    },

    applyState(state) {
        const atem = state.atem || {};
        const obs = state.obs || {};
        const yt = state.youtube || {};
        const reaper = state.reaper || {};
        const alerts = state.alerts || {};

        const isStreaming = obs.isStreaming ? obs.isStreaming : atem.isStreaming;
        const dur = obs.isStreaming ? (obs.streamDuration || 0) : (atem.streamDuration || 0);

        // On Air / Tally
        const isLive = isStreaming || yt.broadcastState === 'live';
        if (isLive) {
            this.dom.tallyPill.className = 'px-2.5 py-1 rounded bg-red-950/50 border border-red-800 text-xs font-bold font-mono text-red-400 flex items-center gap-1.5';
            this.dom.tallyLed.className = 'tally-led tally-red';
            this.dom.tallyText.textContent = 'ON AIR';
        } else {
            this.dom.tallyPill.className = 'px-2.5 py-1 rounded bg-[#101722] border border-[#243242] text-xs font-bold font-mono text-slate-400 flex items-center gap-1.5';
            this.dom.tallyLed.className = 'tally-led tally-off';
            this.dom.tallyText.textContent = 'OFFLINE';
        }

        // Duration
        const h = Math.floor(dur / 3600).toString().padStart(2, '0');
        const m = Math.floor((dur % 3600) / 60).toString().padStart(2, '0');
        const s = (dur % 60).toString().padStart(2, '0');
        this.dom.durationText.textContent = `${h}:${m}:${s}`;

        // Silence Alarm
        if (alerts.isSilent) {
            this.dom.silenceAlarm.classList.remove('hidden');
        } else {
            this.dom.silenceAlarm.classList.add('hidden');
        }

        // Bitrate
        const bitrate = obs.isStreaming ? (obs.outputBitrate || 0) : (atem.isStreaming ? 4500 : 0);
        this.dom.bitrateText.textContent = `${bitrate} kbps`;
        
        // OBS Scene
        if (this.dom.obsSceneText) {
            this.dom.obsSceneText.textContent = obs.currentScene || '---';
        }

        // YouTube Audio Status
        const audioConnected = reaper.connected;
        const leftDb = reaper.leftDb ?? -60;
        const isSilent = leftDb <= -50;

        if (audioConnected && !isSilent && isLive) {
            this.dom.ytDot.className = 'tally-led tally-green';
            this.dom.ytAudioStatus.textContent = 'YT AAC OK';
            this.dom.ytAudioStatus.className = 'text-emerald-400 font-semibold';
        } else if (isSilent && isLive) {
            this.dom.ytDot.className = 'tally-led tally-amber';
            this.dom.ytAudioStatus.textContent = 'SILENT FEED';
            this.dom.ytAudioStatus.className = 'text-amber-400 font-semibold';
        } else {
            this.dom.ytDot.className = 'tally-led tally-off';
            this.dom.ytAudioStatus.textContent = 'STANDBY';
            this.dom.ytAudioStatus.className = 'text-slate-400 font-semibold';
        }

        // Viewers
        this.dom.viewersCount.textContent = yt.viewerCount || 0;

        // Audio Level
        const getPct = db => Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
        this.dom.miniVuFill.style.width = `${getPct(leftDb)}%`;
        this.dom.audioDbText.textContent = leftDb <= -59 ? '-inf' : leftDb.toFixed(1);

        // ATEM 2-Camera Program Tally
        const pgm = atem.programInput || 0;
        const cam1Btn = document.getElementById('hud-cam1');
        const cam2Btn = document.getElementById('hud-cam2');
        if (cam1Btn) {
            cam1Btn.className = pgm === 1
                ? 'px-2 py-1 rounded bg-red-600 text-white font-black border border-red-400 shadow-sm cursor-pointer'
                : 'px-2 py-1 rounded bg-[#182230] hover:bg-slate-700 text-slate-300 font-bold border border-[#243242] cursor-pointer';
        }
        if (cam2Btn) {
            cam2Btn.className = pgm === 2
                ? 'px-2 py-1 rounded bg-red-600 text-white font-black border border-red-400 shadow-sm cursor-pointer'
                : 'px-2 py-1 rounded bg-[#182230] hover:bg-slate-700 text-slate-300 font-bold border border-[#243242] cursor-pointer';
        }
    },

    async setCam(input) {
        try {
            await fetch('/api/atem/program', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input })
            });
        } catch (err) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ type: 'ATEM_SET_PROGRAM', data: { input } }));
            }
        }
    },

    async atemCut() {
        try {
            await fetch('/api/atem/cut', { method: 'POST' });
        } catch (err) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ type: 'ATEM_CUT' }));
            }
        }
    },

    async triggerReopenScreen() {
        const btn = document.getElementById('btn-hud-reopen');
        const origText = btn ? btn.innerHTML : null;
        if (btn) {
            btn.innerHTML = '<span>⏳ Restoring...</span>';
            btn.disabled = true;
        }

        try {
            await fetch('/api/control/reopen-screen', { method: 'POST' });
        } catch (err) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ type: 'REOPEN_SCREEN', data: {} }));
            }
        } finally {
            if (btn) {
                setTimeout(() => {
                    btn.innerHTML = origText;
                    btn.disabled = false;
                }, 2000);
            }
        }
    },

    async triggerPanic() {
        if (!confirm('🚨 EMERGENCY PANIC:\nBlank all screen captions and mute output?')) return;
        try {
            await fetch('/api/control/panic', { method: 'POST' });
        } catch (err) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ type: 'PANIC_CAPTIONS' }));
            }
        }
    }
};

document.addEventListener('DOMContentLoaded', () => HUD.init());
</script>

</body>
</html>
